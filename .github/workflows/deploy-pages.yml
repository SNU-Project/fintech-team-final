name: Deploy to GitHub Pages

# 빌드 단계가 없다. 정적 파일을 그대로 올린다.
# 발표 직전에 CI가 깨질 여지를 없애려고 의도적으로 이렇게 뒀다.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 배포 전 데이터 파일 점검
        run: |
          set -e
          for f in data/market.json data/cpi.json data/meta.json; do
            test -s "$f" || { echo "::error::$f 가 없거나 비어 있습니다"; exit 1; }
            python3 -c "import json,sys; json.load(open('$f'))" || { echo "::error::$f JSON 파싱 실패"; exit 1; }
          done
          echo "데이터 파일 3개 정상"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
