name: Update market data

# Yahoo Finance는 CORS를 열어 주지 않아 브라우저에서 직접 못 부른다.
# 그래서 여기서 주기적으로 받아 data/*.json으로 갱신한다.
# (물가·환율·비트코인은 CORS가 열려 있어 페이지가 직접 실시간 조회한다)
#
# main은 보호되어 있어 봇이 직접 push할 수 없다(2026-08-07~09 3일간 이것 때문에
# 계속 실패했다). 그래서 직접 push하지 않고 PR을 연다. 관리자는 검사 없이도
# 머지할 수 있으므로 클릭 한 번이면 끝난다.

on:
  schedule:
    - cron: "0 21 * * 0"   # UTC 일 21:00 = KST 월 06:00 (주 1회)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 수집
        run: python pipeline/fetch_data.py

      - name: 정제
        run: python pipeline/transform.py

      - name: 검증
        run: |
          python - <<'PY'
          import json, re, sys

          market = json.load(open("data/market.json"))
          cpi = json.load(open("data/cpi.json"))

          problems = []
          fx_excluded = {
              match.group(1)
              for note in market.get("notes", [])
              if (match := re.search(r"원/달러 (\d{4}-\d{2}).*제외", note))
          }

          def month_number(month):
              year, value = map(int, month.split("-"))
              return year * 12 + value - 1

          def month_label(number):
              return f"{number // 12:04d}-{number % 12 + 1:02d}"

          for a in market["assets"]:
              if a.get("assumed"):
                  continue
              if a["months"] < 24:
                  problems.append(f"{a['name']}: 관측치 {a['months']}개월")
              # 자릿수 오류가 남아 있으면 여기서 걸린다
              if abs(a["cagr"]) > 3:
                  problems.append(f"{a['name']}: CAGR {a['cagr']:.1%} — 비정상")
              if a["volatility"] > 5:
                  problems.append(f"{a['name']}: 변동성 {a['volatility']:.1%} — 비정상")
              if a["mdd"] and a["mdd"]["depth"] <= -0.99:
                  problems.append(f"{a['name']}: MDD {a['mdd']['depth']:.1%} — 오류 틱 의심")

              index = a.get("index") or {}
              months = sorted(index)
              if len(months) != a["months"]:
                  problems.append(
                      f"{a['name']}: months={a['months']}지만 index 관측치는 {len(months)}개"
                  )
              if len(months) >= 2:
                  expected = {
                      month_label(number)
                      for number in range(month_number(months[0]), month_number(months[-1]) + 1)
                  }
                  missing = sorted(expected - set(months))
                  # 원/달러의 검증된 단일 오류 틱을 제거한 결과만 USD 자산에
                  # 한 달까지 허용한다. 그 밖의 결측은 일봉 fallback 실패다.
                  allowed = fx_excluded if a.get("krw_converted") else set()
                  unexpected = [month for month in missing if month not in allowed]
                  if unexpected or len(missing) > 1:
                      problems.append(
                          f"{a['name']}: 월 시계열 결측 {len(missing)}개 "
                          f"({', '.join(missing[:8])}{'…' if len(missing) > 8 else ''})"
                      )
                  elif missing:
                      print(
                          f"::warning::{a['name']}: 원/달러 오류 틱 제외로 "
                          f"{missing[0]} 한 달 결측 허용"
                      )

          if len(cpi["index"]) < 24:
              problems.append(f"CPI 관측치 {len(cpi['index'])}개월")
          if len(cpi.get("categories", [])) != 12:
              problems.append(f"품목별 물가 {len(cpi.get('categories', []))}개 (12개여야 함)")

          if problems:
              print("::error::검증 실패 — PR을 만들지 않습니다")
              for p in problems:
                  print(f"  - {p}")
              sys.exit(1)

          print(f"검증 통과 — 자산 {len(market['assets'])}종, CPI {len(cpi['index'])}개월, "
                f"품목 {len(cpi['categories'])}개, 월 시계열 연속성 정상")
          PY

      - name: 변경 여부 확인
        id: diff
        run: |
          if git diff --quiet -- data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "데이터 변경 없음 — PR 생략"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- data/
          fi

      - name: 갱신 PR 열고 자동 머지
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="data/auto-refresh-$DATE"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/
          git commit -m "chore(data): 시세·물가 스냅샷 갱신 ($DATE)"
          git push -f origin "$BRANCH"

          SNAP=$(python -c "import json;print(json.load(open('data/market.json'))['source_fetched_at'][:10])")

          # PR 본문은 파일로 만든다. run 블록 안에서 heredoc을 쓰면 본문이
          # 들여쓰기 0으로 들어가 YAML 블록 스칼라가 거기서 끊긴다.
          # (2026-08-10에 이것 때문에 워크플로 전체가 파싱 실패했다)
          {
            printf '## 자동 데이터 갱신\n\n'
            printf 'Yahoo Finance와 OECD에서 다시 받아 data/*.json 을 갱신했습니다.\n'
            printf '수집 시각: **%s**\n\n' "$SNAP"
            printf '## 자체 점검\n\n판정: 🟢 자동 검증 통과\n\n'
            printf -- '- 자산별 관측치 24개월 이상·월 시계열 연속성 확인\n'
            printf -- '- CAGR·변동성·최대낙폭 정상 범위 (오류 틱 없음)\n'
            printf -- '- CPI 12품목 전부 수신\n'
            printf -- '- 코드 변경 없음 — data/ 하위 JSON만 변경\n'
          } > /tmp/pr-body.md

          gh pr create --base main --head "$BRANCH" \
            --title "chore(data): 시세·물가 스냅샷 갱신 ($DATE)" \
            --body-file /tmp/pr-body.md

          # 검사를 통과하면 알아서 머지되고 브랜치도 지워진다.
          # 사람이 클릭할 일이 없다.
          gh pr merge "$BRANCH" --squash --auto --delete-branch
