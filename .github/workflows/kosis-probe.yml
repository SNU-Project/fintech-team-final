name: KOSIS probe

# 일회성 탐색용. 구조 파악이 끝나면 지운다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: DT_1L9U105 메타·데이터 확인
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          key = os.environ["KOSIS_API_KEY"]
          BASE = "https://kosis.kr/openapi/Param/statisticsParameterData.do"

          def get(url, tries=3):
              last = None
              for i in range(tries):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                      with urllib.request.urlopen(req, timeout=90) as r:
                          return r.read().decode("utf-8", "replace")
                  except Exception as exc:
                      last = exc
                      print(f"   재시도 {i+1}/{tries}: {exc}")
                      time.sleep(5)
              raise last

          common = f"method=getList&apiKey={key}&orgId=101&tblId=DT_1L9U105&format=json&jsonVD=Y"

          # 1) 메타: 이 표의 분류·항목 정의
          print("══ 메타 (분류/항목 정의) ══")
          try:
              raw = get(f"{BASE}?{common.replace('getList','getMeta')}&type=ALL")
              print(raw[:1200])
          except Exception as exc:
              print("메타 실패:", exc)

          # 2) 데이터: 최근 1분기, 분류 전체 + 항목 전체
          print("\n══ 데이터 (최근 1분기) ══")
          try:
              raw = get(f"{BASE}?{common}&objL1=ALL&itmId=ALL&prdSe=Q&newEstPrdCnt=1")
              rows = json.loads(raw)
              if isinstance(rows, dict):
                  print("에러 응답:", json.dumps(rows, ensure_ascii=False)[:300])
              else:
                  print(f"총 {len(rows)}행\n")
                  print("── 첫 행 ──")
                  for k, v in rows[0].items():
                      print(f"  {k:10} = {v}")
                  print("\n── 분류(C1) ──")
                  c1 = {}
                  for r in rows: c1.setdefault(r.get("C1_NM"), r.get("C1"))
                  for nm, code in list(c1.items())[:12]: print(f"  {code}  {nm}")
                  print("\n── 항목(ITM) ──")
                  itm = {}
                  for r in rows: itm.setdefault(r.get("ITM_NM"), r.get("ITM_ID"))
                  for nm, code in list(itm.items())[:35]: print(f"  {code}  {nm}")
                  print("\n── 기간 ──", sorted({r.get("PRD_DE") for r in rows}))
          except Exception as exc:
              print("데이터 실패:", exc)
          PY
