name: KOSIS probe

# 일회성 탐색용. 구조 파악이 끝나면 지운다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 엔드포인트 진단
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, socket, ssl, time, urllib.request
          key = os.environ["KOSIS_API_KEY"]

          def probe(label, url, timeout=25):
              t0 = time.time()
              try:
                  req = urllib.request.Request(url, headers={
                      "User-Agent": "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)",
                      "Accept": "application/json, text/plain, */*",
                      "Accept-Language": "ko-KR,ko;q=0.9",
                      "Referer": "https://kosis.kr/",
                  })
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      body = r.read().decode("utf-8", "replace")
                  print(f"  {label:38} {r.status}  {time.time()-t0:.1f}s  {body[:110]}")
                  return body
              except Exception as exc:
                  print(f"  {label:38} 실패({time.time()-t0:.1f}s): {type(exc).__name__} {exc}")
                  return None

          print("══ 1. 호스트 도달 여부 ══")
          for host in ["kosis.kr", "openapi.kosis.kr"]:
              try:
                  t0 = time.time()
                  socket.create_connection((host, 443), timeout=15).close()
                  print(f"  {host:38} 연결 OK ({time.time()-t0:.1f}s)")
              except Exception as exc:
                  print(f"  {host:38} 연결 실패: {exc}")

          print("\n══ 2. 검색 API (앞서 성공했던 것) ══")
          probe("statisticsSearch", 
                f"https://kosis.kr/openapi/statisticsSearch.do?method=getList&apiKey={key}"
                "&searchNm=%EA%B0%80%EA%B3%84%EC%88%98%EC%A7%80&format=json&jsonVD=Y&startCount=1&resultCount=3")

          print("\n══ 3. 데이터 API — 여러 호스트/경로 ══")
          combos = [
            ("kosis.kr/Param", "https://kosis.kr/openapi/Param/statisticsParameterData.do"),
            ("kosis.kr/statisticsData", "https://kosis.kr/openapi/statisticsData.do"),
            ("openapi.kosis.kr/Param", "https://openapi.kosis.kr/openapi/Param/statisticsParameterData.do"),
          ]
          q = (f"?method=getList&apiKey={key}&orgId=101&tblId=DT_1L9U105"
               "&objL1=ALL&itmId=ALL&prdSe=Q&newEstPrdCnt=1&format=json&jsonVD=Y")
          for label, base in combos:
              probe(label, base + q, timeout=40)

          print("\n══ 4. 아주 작은 요청 (userStatsId 없이 최소) ══")
          probe("최소 요청",
                f"https://kosis.kr/openapi/Param/statisticsParameterData.do?method=getList&apiKey={key}"
                "&orgId=101&tblId=DT_1L9U105&objL1=ALL&itmId=T1&prdSe=Q&newEstPrdCnt=1&format=json&jsonVD=Y",
                timeout=40)
          PY
