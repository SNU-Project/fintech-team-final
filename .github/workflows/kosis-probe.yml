name: KOSIS probe

# 일회성 탐색용. 구조 파악이 끝나면 지운다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 메타 조회로 정확한 코드 확보
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          key = os.environ["KOSIS_API_KEY"]

          def get(url, timeout=40):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.read().decode("utf-8", "replace")

          META = "https://kosis.kr/openapi/statisticsData.do"
          DATA = "https://kosis.kr/openapi/Param/statisticsParameterData.do"
          tbl = f"apiKey={key}&orgId=101&tblId=DT_1L9U105&format=json&jsonVD=Y"

          print("══ 메타: 분류·항목 정의 ══")
          for typ in ["TBL", "OBJ", "ITM", "PRD"]:
              try:
                  raw = get(f"{META}?method=getMeta&{tbl}&type={typ}")
                  print(f"\n── type={typ} ──")
                  print(raw[:900])
              except Exception as exc:
                  print(f"  type={typ} 실패: {exc}")

          print("\n\n══ 데이터: objL1을 여러 형태로 ══")
          for label, extra in {
            "objL1=ALL&itmId=ALL&prdSe=Q": "&objL1=ALL&itmId=ALL&prdSe=Q&newEstPrdCnt=1",
            "objL1=0&itmId=ALL":           "&objL1=0&itmId=ALL&prdSe=Q&newEstPrdCnt=1",
            "objL1=ALL만":                 "&objL1=ALL&prdSe=Q&newEstPrdCnt=1&itmId=ALL&outputFields=NM",
            "startPrdDe 사용":              "&objL1=ALL&itmId=ALL&prdSe=Q&startPrdDe=20244&endPrdDe=20244",
          }.items():
              try:
                  raw = get(DATA + "?method=getList&" + tbl + extra)
                  ok = not raw.strip().startswith("{")
                  print(f"  {label:32} {'✅' if ok else '✗'}  {raw[:130]}")
                  if ok:
                      rows = json.loads(raw)
                      print(f"\n  ══ 성공! {len(rows)}행 ══")
                      for k, v in rows[0].items(): print(f"    {k:10} = {v}")
                      c1, itm = {}, {}
                      for r in rows:
                          c1.setdefault(r.get("C1_NM"), r.get("C1"))
                          itm.setdefault(r.get("ITM_NM"), r.get("ITM_ID"))
                      print("\n    ── 분류 ──")
                      for nm, c in list(c1.items())[:12]: print(f"      {c}  {nm}")
                      print("    ── 항목 ──")
                      for nm, c in list(itm.items())[:40]: print(f"      {c}  {nm}")
                      break
              except Exception as exc:
                  print(f"  {label:32} 실패: {exc}")
          PY
