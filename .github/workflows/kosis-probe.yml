name: KOSIS probe

# 일회성 탐색용. 구조 파악이 끝나면 지운다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 끈질긴 재시도로 파라미터 확정
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          key = os.environ["KOSIS_API_KEY"]

          # KOSIS는 해외 IP(GitHub 러너)에서 자주 타임아웃난다.
          # 국내에서는 0.1초에 응답하므로 서버 문제가 아니라 경로 문제다.
          # 그래서 넉넉히 재시도한다.
          def get(url, tries=12):
              for i in range(tries):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                      with urllib.request.urlopen(req, timeout=20) as r:
                          return r.read().decode("utf-8", "replace")
                  except Exception:
                      time.sleep(3)
              return None

          DATA = "https://kosis.kr/openapi/Param/statisticsParameterData.do"
          tbl = f"apiKey={key}&orgId=101&tblId=DT_1L9U105&format=json&jsonVD=Y"

          combos = {
            "objL1=ALL itmId=ALL":  "&objL1=ALL&itmId=ALL&prdSe=Q&newEstPrdCnt=1",
            "objL1=ALL itmId=T10":  "&objL1=ALL&itmId=T10&prdSe=Q&newEstPrdCnt=1",
            "objL1=ALL 기간명시":     "&objL1=ALL&itmId=ALL&prdSe=Q&startPrdDe=20244&endPrdDe=20244",
            "objL1=ALL prdSe=Y":    "&objL1=ALL&itmId=ALL&prdSe=Y&newEstPrdCnt=1",
          }
          for label, extra in combos.items():
              raw = get(DATA + "?method=getList&" + tbl + extra)
              if raw is None:
                  print(f"  {label:24} 12회 재시도 모두 타임아웃"); continue
              head = raw.strip()[:150]
              if head.startswith("{"):
                  print(f"  {label:24} ✗ {head}")
                  continue
              rows = json.loads(raw)
              print(f"\n  ✅ {label} — {len(rows)}행\n")
              for k, v in rows[0].items(): print(f"     {k:10} = {v}")
              c1, itm = {}, {}
              for r in rows:
                  c1.setdefault(r.get("C1_NM"), r.get("C1"))
                  itm.setdefault(r.get("ITM_NM"), r.get("ITM_ID"))
              print("\n     ── 분류(가구원수) ──")
              for nm, c in list(c1.items())[:12]: print(f"       {c}  {nm}")
              print("     ── 항목(지출품목) ──")
              for nm, c in list(itm.items())[:40]: print(f"       {c}  {nm}")
              print("\n     기간:", sorted({r.get("PRD_DE") for r in rows}))
              break
          PY
