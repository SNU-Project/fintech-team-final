name: KOSIS probe

# 일회성 탐색용. 구조 파악이 끝나면 지운다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: KOSIS 통합검색으로 가계동향조사 찾기
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request

          key = os.environ["KOSIS_API_KEY"]

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=45) as r:
                  return r.read().decode("utf-8", "replace")

          # 1) 통합검색 API — 통계표를 이름으로 찾는다
          for term in ["가계동향조사", "가구원수별 가계수지", "가계수지"]:
              q = urllib.parse.quote(term)
              url = ("https://kosis.kr/openapi/statisticsSearch.do"
                     f"?method=getList&apiKey={key}&searchNm={q}"
                     "&format=json&jsonVD=Y&startCount=1&resultCount=10")
              print(f"\n══ 검색어: {term} ══")
              try:
                  raw = get(url)
              except Exception as exc:
                  print("  요청 실패:", exc); continue
              print("  응답 앞부분:", raw[:200])
              try:
                  rows = json.loads(raw)
              except Exception:
                  continue
              if isinstance(rows, dict):
                  print("  에러 응답:", json.dumps(rows, ensure_ascii=False)[:200]); continue
              for r in rows[:10]:
                  print(f"  ✔ orgId={r.get('ORG_ID')} tblId={r.get('TBL_ID')} | {r.get('TBL_NM')}")
          PY
