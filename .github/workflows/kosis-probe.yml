name: KOSIS probe

# 일회성 탐색용. 구조 파악이 끝나면 지운다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 파라미터 조합 탐색
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          key = os.environ["KOSIS_API_KEY"]
          BASE = "https://kosis.kr/openapi/Param/statisticsParameterData.do"

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.read().decode("utf-8", "replace")

          base = f"method=getList&apiKey={key}&orgId=101&tblId=DT_1L9U105&format=json&jsonVD=Y"

          # KOSIS 문서마다 파라미터 표기가 달라서(objL / objL1 / objL1~8) 전부 시도
          variants = {
            "objL1=ALL":                 "&objL1=ALL&itmId=ALL&prdSe=Q&newEstPrdCnt=1",
            "objL=ALL":                  "&objL=ALL&itmId=ALL&prdSe=Q&newEstPrdCnt=1",
            "objL1+objL2=ALL":           "&objL1=ALL&objL2=ALL&itmId=ALL&prdSe=Q&newEstPrdCnt=1",
            "objL1=ALL, itmId 생략":      "&objL1=ALL&prdSe=Q&newEstPrdCnt=1",
            "objL1=ALL, prdSe=Y":        "&objL1=ALL&itmId=ALL&prdSe=Y&newEstPrdCnt=1",
            "objL1~3=ALL":               "&objL1=ALL&objL2=ALL&objL3=ALL&itmId=ALL&prdSe=Q&newEstPrdCnt=1",
          }

          winner = None
          for name, extra in variants.items():
              print(f"\n══ {name} ══")
              try:
                  raw = get(BASE + "?" + base + extra)
              except Exception as exc:
                  print("  요청 실패:", exc); continue
              try:
                  data = json.loads(raw)
              except Exception:
                  print("  파싱 실패:", raw[:150]); continue
              if isinstance(data, dict):
                  print("  ✗", json.dumps(data, ensure_ascii=False)[:150])
              else:
                  print(f"  ✅ {len(data)}행")
                  winner = (name, data)
                  break

          if not winner:
              print("\n모든 조합 실패")
              raise SystemExit(0)

          name, rows = winner
          print(f"\n══════ 성공: {name} ══════")
          print("\n── 첫 행 ──")
          for k, v in rows[0].items():
              print(f"  {k:10} = {v}")
          print("\n── 분류(C1) ──")
          c1 = {}
          for r in rows: c1.setdefault(r.get("C1_NM"), r.get("C1"))
          for nm, code in list(c1.items())[:12]: print(f"  {code}  {nm}")
          print("\n── 항목(ITM) ──")
          itm = {}
          for r in rows: itm.setdefault(r.get("ITM_NM"), r.get("ITM_ID"))
          for nm, code in list(itm.items())[:40]: print(f"  {code}  {nm}")
          print("\n── 기간 ──", sorted({r.get("PRD_DE") for r in rows}))
          PY
