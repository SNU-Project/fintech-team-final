name: KOSIS probe

# 일회성 탐색용. KOSIS 응답 구조를 알아야 파이프라인을 붙일 수 있는데
# 시크릿 값을 로컬에서 볼 수 없어 여기서 확인한다.
# 구조 파악이 끝나면 이 파일은 지운다.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 가계동향조사 통계표 탐색
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request

          key = os.environ["KOSIS_API_KEY"]

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=40) as resp:
                  return resp.read().decode("utf-8", "replace")

          # 1) '가계동향' 이 들어간 통계표를 찾는다
          q = urllib.parse.quote("가계동향")
          search = ("https://kosis.kr/openapi/statisticsList.do"
                    f"?method=getList&apiKey={key}&vwCd=MT_ZTITLE&parentListId=&format=json&jsonVD=Y"
                    f"&searchNm={q}")
          raw = get(search)
          print("── 통계표 검색 응답 (앞 600자) ──")
          print(raw[:600])
          print()

          try:
              rows = json.loads(raw)
          except Exception as exc:
              print("JSON 파싱 실패:", exc)
              raise SystemExit(0)

          if isinstance(rows, dict):
              print("응답이 객체입니다:", json.dumps(rows, ensure_ascii=False)[:400])
              raise SystemExit(0)

          print(f"── 검색 결과 {len(rows)}건 ──")
          for r in rows[:25]:
              print(f"  orgId={r.get('ORG_ID')}  tblId={r.get('TBL_ID')}  {r.get('TBL_NM')}")
          PY
