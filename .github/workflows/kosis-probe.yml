name: KOSIS probe

# 일회성 탐색용. KOSIS 응답 구조를 알아야 파이프라인을 붙일 수 있는데
# 시크릿 값을 로컬에서 볼 수 없어 여기서 확인한다.
# 구조 파악이 끝나면 이 파일은 지운다.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 가계동향조사 통계표 탐색
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request

          key = os.environ["KOSIS_API_KEY"]

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=40) as resp:
                  return json.loads(resp.read().decode("utf-8", "replace"))

          def drill(parent, depth=0, path=""):
              """주제별 트리를 타고 내려가며 '가계동향'이 든 통계표를 찾는다."""
              url = ("https://kosis.kr/openapi/statisticsList.do"
                     f"?method=getList&apiKey={key}&vwCd=MT_ZTITLE"
                     f"&parentListId={parent}&format=json&jsonVD=Y")
              try:
                  rows = get(url)
              except Exception as exc:
                  print(f"{'  '*depth}! {parent} 조회 실패: {exc}")
                  return
              if not isinstance(rows, list):
                  return
              for r in rows:
                  name = r.get("LIST_NM") or r.get("TBL_NM") or ""
                  tbl = r.get("TBL_ID")
                  if tbl:
                      if "가계동향" in path or "가계동향" in name or "가계수지" in name:
                          print(f"  ✔ orgId={r.get('ORG_ID')} tblId={tbl}  {name}")
                      continue
                  lid = r.get("LIST_ID")
                  if not lid:
                      continue
                  sub = f"{path} > {name}" if path else name
                  # 소득·소비·자산(E) 아래만 훑는다
                  if depth == 0 and lid != "E":
                      continue
                  if depth < 3:
                      drill(lid, depth + 1, sub)

          print("── 소득·소비·자산 아래 가계동향 통계표 ──")
          drill("")
          PY
